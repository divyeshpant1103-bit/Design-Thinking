<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEU Nexus | Secure Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap');

        :root {
            --bg-color: #070d1a;
            --font-main: 'DM Sans', sans-serif;
            --font-display: 'Syne', sans-serif;
            --theme-color: #C9A84C; 
            --theme-glow-rgb: 201, 168, 76;
            --shade-color: #1B3A7A;
            --bulb-color: #FFF9E6;
            --light-opacity: 0.15;
            --face-awake: 1;
            --face-sleep: 0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(201, 168, 76, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201, 168, 76, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #ffffff;
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;    
            overflow-x: hidden;
            padding: 1rem;
        }

        /* Responsive Header */
        .top-header {
            width: 100%;
            max-width: 1100px;
            padding: 2rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 20;
        }
        .logo-icon {
            width: 40px; height: 40px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--theme-color);
            background: white;
            box-shadow: 0 0 15px rgba(var(--theme-glow-rgb), 0.4);
        }
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }
        .logo-text span { color: var(--theme-color); }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            gap: 3rem;
            flex: 1;
        }

        /* Lamp Section */
        .lamp-section { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .lamp-svg { width: 100%; max-width: 300px; height: auto; overflow: visible; }
        .shade-main { fill: var(--shade-color); transition: fill 0.6s ease; }
        .shade-inner { fill: var(--bulb-color); transition: fill 0.6s ease; }
        .light-cone { opacity: var(--light-opacity); transition: opacity 0.6s ease; }
        .face-sleep { opacity: var(--face-sleep); transition: opacity 0.3s ease; }
        .face-awake { opacity: var(--face-awake); transition: opacity 0.3s ease; }

        .pull-string-group { cursor: pointer; transform-origin: top; transition: transform 0.2s; }
        .lamp-ambient-glow {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(var(--theme-glow-rgb), 0.1) 0%, transparent 70%);
            top: 40%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .pull-hint { font-size: 0.7rem; letter-spacing: 2px; color: #5A6380; font-weight: 700; margin-top: -10px; }

        /* Auth Card Area */
        .auth-container { flex: 1; display: flex; justify-content: center; width: 100%; }
        .auth-card {
            width: 100%; max-width: 420px;
            background: rgba(13, 34, 84, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #1B3A7A;
            border-top: 3px solid var(--theme-color);
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .auth-card h2 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.5rem; }
        .auth-card h2 .highlight { color: var(--theme-color); }
        .subtitle { font-size: 0.9rem; color: #9BA3BE; margin-bottom: 1.5rem; }

        .input-group { margin-bottom: 1.2rem; }
        .input-group label { font-size: 0.75rem; color: #9BA3BE; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        .input-prefix { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #5A6380; font-weight: 600; }
        
        .input-group input {
            width: 100%; background: rgba(7, 13, 26, 0.8); 
            border: 1px solid #1B3A7A; padding: 0.9rem 1rem 0.9rem 2.5rem; 
            border-radius: 12px; color: #fff; outline: none; font-size: 0.95rem;
        }
        .input-group input:focus { border-color: var(--theme-color); }

        .auth-btn {
            width: 100%; padding: 1.1rem; border: none; border-radius: 12px;
            background: var(--theme-color); color: #070d1a;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(var(--theme-glow-rgb), 0.3); }

        .form-container { display: none; }
        .form-container.active { display: block; animation: fadeSlideUp 0.4s ease; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* MOBILE OVERLAP FIX */
        @media (max-width: 800px) {
            .main-wrapper { flex-direction: column; gap: 2rem; padding-bottom: 3rem; }
            .lamp-svg { max-width: 200px; }
            .auth-card { padding: 2rem 1.5rem; }
            .auth-card h2 { font-size: 1.7rem; }
            .top-header { padding: 1rem 0; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="logo.png" alt="GEU Nexus Logo" class="logo-icon">
        <div class="logo-text">GEU <span>NEXUS</span></div>
    </header>

    <div class="main-wrapper">
        <div class="lamp-section">
            <div class="lamp-ambient-glow"></div>
            <svg class="lamp-svg" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lightConeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <polygon points="90,180 210,180 340,420 -40,420" fill="url(#lightConeGrad)" class="light-cone" />
                <ellipse cx="150" cy="380" rx="65" ry="12" fill="#030712" />
                <ellipse cx="150" cy="376" rx="65" ry="12" fill="#0f172a" />
                <rect x="142" y="180" width="16" height="200" fill="#1e293b" />
                <ellipse cx="150" cy="175" rx="95" ry="18" class="shade-inner" />

                <g class="pull-string-group" onclick="toggleLamp()">
                    <line x1="115" y1="180" x2="115" y2="270" stroke="#475569" stroke-width="2" />
                    <rect x="111" y="270" width="8" height="30" rx="4" fill="#475569" class="string-handle" />
                </g>

                <path d="M 90 60 Q 150 45 210 60 L 245 175 Q 150 195 55 175 Z" class="shade-main" />

                <g class="face-sleep">
                    <path d="M 120 130 Q 130 140 140 130" stroke="#0f172a" stroke-width="4" fill="none" />
                    <path d="M 160 130 Q 170 140 180 130" stroke="#0f172a" stroke-width="4" fill="none" />
                </g>

                <g class="face-awake">
                    <path d="M 120 130 Q 130 115 140 130" stroke="#0f172a" stroke-width="4" fill="none" />
                    <path d="M 160 130 Q 170 115 180 130" stroke="#0f172a" stroke-width="4" fill="none" />
                    <path d="M 125 155 Q 150 190 175 155 Z" fill="#0f172a" />
                </g>
            </svg>
            <p class="pull-hint">PULL TO TOGGLE</p>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <div id="login-form" class="form-container active">
                    <h2>Student <span class="highlight">Login</span></h2>
                    <p class="subtitle">Enter your official GEU credentials.</p>
                    
                    <form onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <label>University Email</label>
                            <div class="input-wrapper">
                                <span class="input-prefix">@</span>
                                <input type="email" placeholder="student@geu.ac.in" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <div class="input-wrapper">
                                <span class="input-prefix">***</span>
                                <input type="password" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="auth-btn">Authorize & Enter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Set your demo credentials here
        const VALID_EMAIL = "admin@geu.ac.in";
        const VALID_PASSWORD = "nexus";

        const themes = [
            { themeColor: "#C9A84C", shadeColor: "#1B3A7A", bulbColor: "#FFF9E6", lightOpacity: "0.15", faceAwake: "1", faceSleep: "0" },
            { themeColor: "#1e293b", shadeColor: "#0f172a", bulbColor: "#020617", lightOpacity: "0", faceAwake: "0", faceSleep: "1" }
        ];

        let currentThemeIndex = 0;
        function toggleLamp() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const config = themes[currentThemeIndex];
            const root = document.documentElement.style;

            root.setProperty('--theme-color', config.themeColor);
            root.setProperty('--shade-color', config.shadeColor);
            root.setProperty('--bulb-color', config.bulbColor);
            root.setProperty('--light-opacity', config.lightOpacity);
            root.setProperty('--face-awake', config.faceAwake);
            root.setProperty('--face-sleep', config.faceSleep);
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = event.target.querySelector('input[type="email"]').value;
            const password = event.target.querySelector('input[type="password"]').value;

            if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                localStorage.setItem('geuNexusAuth', 'true');
                const btn = event.target.querySelector('.auth-btn');
                btn.innerText = "Access Granted...";
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } else {
                alert("❌ Unauthorized Access! Please check your credentials.");
                event.target.querySelector('input[type="password"]').value = '';
            }
        }
    </script>
</body>
</html>
